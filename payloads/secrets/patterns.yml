metadata:
  type: secrets/patterns
  version: "1.0"
  description: "Regex patterns for detecting secrets and credentials"
  sources: ["OWASP", "truffleHog", "git-secrets", "detect-secrets"]

detection_patterns: []

payloads:
  cloud_credentials:
    - value: "AKIA[0-9A-Z]{16}"
      description: "AWS Access Key ID"
      severity: critical
      tags: [aws, access_key]

    - value: "(?i)aws_secret_access_key\\s*[=:]\\s*['\"]?([A-Za-z0-9/+=]{40})['\"]?"
      description: "AWS Secret Access Key"
      severity: critical
      tags: [aws, secret_key]

    - value: "(?i)aws_session_token\\s*[=:]\\s*['\"]?([A-Za-z0-9/+=]{100,})['\"]?"
      description: "AWS Session Token"
      severity: critical
      tags: [aws, session_token]

    - value: "(?i)amazonaws\\.com.*?AccessKeyId"
      description: "AWS response AccessKeyId"
      severity: high
      tags: [aws, response]

    - value: "(?i)GOOG[0-9A-Z]{20}"
      description: "GCP API Key"
      severity: critical
      tags: [gcp, api_key]

    - value: "(?i)ya29\\.[0-9A-Za-z\\-_]+"
      description: "GCP OAuth Access Token"
      severity: critical
      tags: [gcp, oauth]

    - value: "(?i)AIza[0-9A-Za-z\\-_]{35}"
      description: "Google API Key"
      severity: critical
      tags: [google, api_key]

    - value: "(?i)[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
      description: "Google OAuth Client ID"
      severity: high
      tags: [google, oauth]

    - value: "(?i)sk-[A-Za-z0-9]{48}"
      description: "OpenAI API Key"
      severity: critical
      tags: [openai, api_key]

    - value: "(?i)sk-proj-[A-Za-z0-9_-]{40,}"
      description: "OpenAI Project API Key"
      severity: critical
      tags: [openai, api_key]

    - value: "(?i)sk-ant-[A-Za-z0-9_-]{40,}"
      description: "Anthropic API Key"
      severity: critical
      tags: [anthropic, api_key]

    - value: "(?i)xox[bporas]-[0-9A-Za-z-]+"
      description: "Slack Token"
      severity: critical
      tags: [slack, token]

    - value: "(?i)https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
      description: "Slack Webhook URL"
      severity: high
      tags: [slack, webhook]

    - value: "(?i)ghp_[A-Za-z0-9]{36}"
      description: "GitHub Personal Access Token"
      severity: critical
      tags: [github, pat]

    - value: "(?i)gho_[A-Za-z0-9]{36}"
      description: "GitHub OAuth Token"
      severity: critical
      tags: [github, oauth]

    - value: "(?i)ghu_[A-Za-z0-9]{36}"
      description: "GitHub User-to-Server Token"
      severity: critical
      tags: [github, token]

    - value: "(?i)ghs_[A-Za-z0-9]{36}"
      description: "GitHub Server-to-Server Token"
      severity: critical
      tags: [github, token]

    - value: "(?i)ghr_[A-Za-z0-9]{36}"
      description: "GitHub Refresh Token"
      severity: critical
      tags: [github, token]

    - value: "(?i)github_pat_[A-Za-z0-9_]{22,}"
      description: "GitHub Fine-grained PAT"
      severity: critical
      tags: [github, pat]

    - value: "(?i)glpat-[A-Za-z0-9\\-_]{20,}"
      description: "GitLab Personal Access Token"
      severity: critical
      tags: [gitlab, pat]

    - value: "(?i)glrt-[A-Za-z0-9\\-_]{20,}"
      description: "GitLab Runner Token"
      severity: critical
      tags: [gitlab, runner]

  api_keys:
    - value: "(?i)sk_live_[0-9a-zA-Z]{24,}"
      description: "Stripe Secret Key (Live)"
      severity: critical
      tags: [stripe, secret]

    - value: "(?i)pk_live_[0-9a-zA-Z]{24,}"
      description: "Stripe Publishable Key (Live)"
      severity: high
      tags: [stripe, publishable]

    - value: "(?i)sk_test_[0-9a-zA-Z]{24,}"
      description: "Stripe Secret Key (Test)"
      severity: medium
      tags: [stripe, test]

    - value: "(?i)rk_live_[0-9a-zA-Z]{24,}"
      description: "Stripe Restricted Key (Live)"
      severity: critical
      tags: [stripe, restricted]

    - value: "(?i)SG\\.[A-Za-z0-9\\-_]{22}\\.[A-Za-z0-9\\-_]{43}"
      description: "SendGrid API Key"
      severity: critical
      tags: [sendgrid, api_key]

    - value: "(?i)key-[0-9a-zA-Z]{32}"
      description: "Mailgun API Key"
      severity: critical
      tags: [mailgun, api_key]

    - value: "(?i)AC[a-z0-9]{32}"
      description: "Twilio Account SID"
      severity: high
      tags: [twilio, sid]

    - value: "(?i)SK[a-z0-9]{32}"
      description: "Twilio Auth Token"
      severity: critical
      tags: [twilio, auth_token]

    - value: "(?i)PN[0-9a-z]{32}"
      description: "Twilio Phone Number SID"
      severity: medium
      tags: [twilio, phone]

    - value: "(?i)xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
      description: "Slack Bot Token"
      severity: critical
      tags: [slack, bot]

    - value: "(?i)xoxp-[0-9]{10,13}-[0-9]{10,13}-[0-9]{10,13}-[a-z0-9]{32}"
      description: "Slack User Token"
      severity: critical
      tags: [slack, user]

    - value: "(?i)xoxe-1-[0-9a-zA-Z-]+"
      description: "Slack App Token"
      severity: critical
      tags: [slack, app]

    - value: "(?i)discord\\.(com|app)\\/api\\/webhooks\\/[0-9]+\\/[A-Za-z0-9\\-_]+"
      description: "Discord Webhook URL"
      severity: high
      tags: [discord, webhook]

    - value: "(?i)[0-9]{17,18}\\.[A-Za-z0-9_-]{6}\\.[A-Za-z0-9_-]{27,}"
      description: "Discord Bot Token"
      severity: critical
      tags: [discord, bot]

    - value: "(?i)bot\\s+[A-Za-z0-9_-]{35,}"
      description: "Telegram Bot Token"
      severity: critical
      tags: [telegram, bot]

    - value: "(?i)[0-9]{9,10}:AA[A-Za-z0-9_-]{32,}"
      description: "Telegram Bot Token (alt)"
      severity: critical
      tags: [telegram, bot]

    - value: "(?i)npm_[A-Za-z0-9]{36}"
      description: "NPM Access Token"
      severity: critical
      tags: [npm, token]

    - value: "(?i)pypi-[A-Za-z0-9]{50,}"
      description: "PyPI API Token"
      severity: critical
      tags: [pypi, token]

    - value: "(?i)rubygems_[A-Za-z0-9]{48}"
      description: "RubyGems API Key"
      severity: critical
      tags: [rubygems, api_key]

    - value: "(?i)DO_[A-Za-z0-9]{64}"
      description: "DigitalOcean Token"
      severity: critical
      tags: [digitalocean, token]

    - value: "(?i)dop_v1_[a-f0-9]{64}"
      description: "Doppler Token"
      severity: critical
      tags: [doppler, token]

    - value: "(?i)DOP_[A-Za-z0-9]{32}"
      description: "Doppler Service Token"
      severity: critical
      tags: [doppler, token]

    - value: "(?i)hook-[a-z0-9]{24}"
      description: "Asana Token"
      severity: high
      tags: [asana, token]

    - value: "(?i)skey-[A-Za-z0-9]{24}"
      description: "Shopify Secret Key"
      severity: critical
      tags: [shopify, secret]

    - value: "(?i)shpat_[a-fA-F0-9]{32}"
      description: "Shopify Access Token"
      severity: critical
      tags: [shopify, token]

    - value: "(?i)SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
      description: "Twilio SendGrid Key"
      severity: critical
      tags: [sendgrid, api_key]

    - value: "(?i)sqs\\.amazonaws\\.com.*?AWS_ACCESS_KEY_ID"
      description: "AWS SQS URL with key"
      severity: high
      tags: [aws, sqs]

  private_keys:
    - value: "-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----"
      description: "Private key header"
      severity: critical
      tags: [private_key, ssh]

    - value: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
      description: "PGP private key"
      severity: critical
      tags: [private_key, pgp]

    - value: "-----BEGIN ENCRYPTED PRIVATE KEY-----"
      description: "Encrypted private key"
      severity: critical
      tags: [private_key, encrypted]

    - value: "-----BEGIN PRIVATE KEY-----"
      description: "PKCS#8 private key"
      severity: critical
      tags: [private_key, pkcs8]

    - value: "(?i)MIIE[a-zA-Z0-9+/]{50,}"
      description: "Base64 RSA key body"
      severity: critical
      tags: [private_key, base64]

    - value: "(?i)MC[a-zA-Z0-9+/]{50,}"
      description: "Base64 EC key body"
      severity: critical
      tags: [private_key, base64]

    - value: "(?i)MII[a-zA-Z0-9+/]{50,}="
      description: "Base64 key with padding"
      severity: critical
      tags: [private_key, base64]

  jwt_tokens:
    - value: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+"
      description: "JWT Token"
      severity: high
      tags: [jwt]

    - value: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+"
      description: "JWT Token (generic)"
      severity: high
      tags: [jwt]

    - value: "(?i)jwt\\s*[=:]\\s*['\"]?eyJ[A-Za-z0-9_-]+"
      description: "JWT in assignment"
      severity: high
      tags: [jwt, assignment]

    - value: "(?i)token\\s*[=:]\\s*['\"]?eyJ[A-Za-z0-9_-]+"
      description: "Token assignment JWT"
      severity: high
      tags: [jwt, assignment]

    - value: "(?i)bearer\\s+eyJ[A-Za-z0-9_-]+"
      description: "Bearer JWT"
      severity: high
      tags: [jwt, bearer]

  database_connection:
    - value: "(?i)(mysql|postgres|postgresql|mongodb|redis|sqlite|mssql)://[^\\s]+"
      description: "Database connection string"
      severity: critical
      tags: [database, connection_string]

    - value: "(?i)mysql://[a-zA-Z0-9]+:[^@]+@[^/]+/[a-zA-Z0-9_]+"
      description: "MySQL connection string"
      severity: critical
      tags: [database, mysql]

    - value: "(?i)postgres(ql)?://[a-zA-Z0-9]+:[^@]+@[^/]+/[a-zA-Z0-9_]+"
      description: "PostgreSQL connection string"
      severity: critical
      tags: [database, postgresql]

    - value: "(?i)mongodb(\\+srv)?://[a-zA-Z0-9]+:[^@]+@[^/]+/[a-zA-Z0-9_]+"
      description: "MongoDB connection string"
      severity: critical
      tags: [database, mongodb]

    - value: "(?i)redis://[^\\s]+"
      description: "Redis connection string"
      severity: critical
      tags: [database, redis]

    - value: "(?i)amqp://[^\\s]+"
      description: "AMQP connection string"
      severity: critical
      tags: [database, amqp]

    - value: "(?i)Data Source=[^;]+;Password=[^;]+"
      description: "ADO.NET connection string"
      severity: critical
      tags: [database, adonet]

    - value: "(?i)Server=[^;]+;Database=[^;]+;User Id=[^;]+;Password=[^;]+"
      description: "SQL Server connection string"
      severity: critical
      tags: [database, mssql]

  generic_secrets:
    - value: "(?i)(api[_-]?key|apikey|api[_-]?secret)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{20,})['\"]?"
      description: "Generic API key"
      severity: high
      tags: [generic, api_key]

    - value: "(?i)(secret[_-]?key|secretkey)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{20,})['\"]?"
      description: "Generic secret key"
      severity: high
      tags: [generic, secret]

    - value: "(?i)(access[_-]?token|accesstoken)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{20,})['\"]?"
      description: "Generic access token"
      severity: high
      tags: [generic, token]

    - value: "(?i)(auth[_-]?token|authtoken)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{20,})['\"]?"
      description: "Generic auth token"
      severity: high
      tags: [generic, token]

    - value: "(?i)(password|passwd|pwd)\\s*[=:]\\s*['\"]?([^'\"\\s]{8,})['\"]?"
      description: "Generic password"
      severity: high
      tags: [generic, password]

    - value: "(?i)(secret|SECRET)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{8,})['\"]?"
      description: "Generic secret"
      severity: high
      tags: [generic, secret]

    - value: "(?i)(private[_-]?key|privatekey)\\s*[=:]\\s*['\"]?([A-Za-z0-9_/+=]{20,})['\"]?"
      description: "Generic private key"
      severity: critical
      tags: [generic, private_key]

    - value: "(?i)Authorization:\\s*Bearer\\s+[A-Za-z0-9_\\-\\.]+"
      description: "Bearer token header"
      severity: high
      tags: [generic, bearer]

    - value: "(?i)Authorization:\\s*Basic\\s+[A-Za-z0-9+/=]+"
      description: "Basic auth header"
      severity: high
      tags: [generic, basic_auth]

    - value: "(?i)(ssh-rsa|ssh-ed25519|ssh-dss)\\s+AAAA[A-Za-z0-9+/=]+"
      description: "SSH public key"
      severity: medium
      tags: [generic, ssh_public]

    - value: "(?i)SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
      description: "SendGrid key (duplicate for coverage)"
      severity: critical
      tags: [generic, sendgrid]

    - value: "(?i)xox[bporas]-[0-9A-Za-z-]+"
      description: "Slack token (duplicate for coverage)"
      severity: critical
      tags: [generic, slack]

    - value: "(?i)AKIA[0-9A-Z]{16}"
      description: "AWS key (duplicate for coverage)"
      severity: critical
      tags: [generic, aws]

    - value: "(?i)ghp_[A-Za-z0-9]{36}"
      description: "GitHub token (duplicate for coverage)"
      severity: critical
      tags: [generic, github]

    - value: "(?i)sk-[A-Za-z0-9]{48}"
      description: "OpenAI key (duplicate for coverage)"
      severity: critical
      tags: [generic, openai]

    - value: "(?i)[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
      description: "Google client ID (duplicate)"
      severity: high
      tags: [generic, google]

    - value: "(?i)AIza[0-9A-Za-z_-]{35}"
      description: "Google API key (duplicate)"
      severity: critical
      tags: [generic, google]

    - value: "(?i)ya29\\.[0-9A-Za-z_-]+"
      description: "Google OAuth token (duplicate)"
      severity: critical
      tags: [generic, google]

    - value: "(?i)sk_live_[0-9a-zA-Z]{24,}"
      description: "Stripe live key (duplicate)"
      severity: critical
      tags: [generic, stripe]

    - value: "(?i)SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
      description: "SendGrid (duplicate)"
      severity: critical
      tags: [generic, sendgrid]

    - value: "(?i)key-[0-9a-zA-Z]{32}"
      description: "Mailgun key (duplicate)"
      severity: critical
      tags: [generic, mailgun]

    - value: "(?i)AC[a-z0-9]{32}"
      description: "Twilio SID (duplicate)"
      severity: high
      tags: [generic, twilio]

    - value: "(?i)SK[a-z0-9]{32}"
      description: "Twilio token (duplicate)"
      severity: critical
      tags: [generic, twilio]

    - value: "(?i)[0-9]{17,18}\\.[A-Za-z0-9_-]{6}\\.[A-Za-z0-9_-]{27,}"
      description: "Discord token (duplicate)"
      severity: critical
      tags: [generic, discord]

    - value: "(?i)https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
      description: "Slack webhook (duplicate)"
      severity: high
      tags: [generic, slack]

    - value: "(?i)npm_[A-Za-z0-9]{36}"
      description: "NPM token (duplicate)"
      severity: critical
      tags: [generic, npm]

    - value: "(?i)DO_[A-Za-z0-9]{64}"
      description: "DigitalOcean token (duplicate)"
      severity: critical
      tags: [generic, digitalocean]
