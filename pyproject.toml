[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-security"
version = "3.0.0"
description = "AI-powered autonomous security testing platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "mysterious75"},
]
keywords = ["security", "pentest", "vulnerability", "scanner", "ai", "cybersecurity", "bugbounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx[http2]>=0.27.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.4",
    "rich>=13.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "playwright>=1.50.0",
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8",
]

[project.scripts]
prometheus = "src.entry:main"

[project.urls]
Homepage = "https://github.com/mysterious75/prometheus"
Repository = "https://github.com/mysterious75/prometheus"
Issues = "https://github.com/mysterious75/prometheus/issues"
