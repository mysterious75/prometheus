name: Prometheus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install flake8
      - name: Check for critical syntax errors
        run: |
          python -m py_compile src/main.py && echo "main.py OK"
          python -m py_compile src/offline.py && echo "offline.py OK"
          python -m py_compile src/cli/interface.py && echo "cli OK"
          python -m py_compile src/scanner/sqli.py && echo "sqli OK"
          python -m py_compile src/scanner/xss.py && echo "xss OK"
          python -m py_compile src/scanner/ssrf.py && echo "ssrf OK"
          python -m py_compile src/scanner/crawler.py && echo "crawler OK"
          python -m py_compile src/agent/report_agent.py && echo "report_agent OK"
          python -m py_compile src/agent/pipeline.py && echo "pipeline OK"
          python -m py_compile src/scanner/adversarial.py && echo "adversarial OK"
          python -m py_compile src/scanner/api_discovery.py && echo "api_discovery OK"
          python -m py_compile src/api/app.py && echo "api OK"
          echo "All critical files compile OK"

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install networkx pytest-timeout
      - name: Check core imports
        run: |
          python -c "
          from src.main import Prometheus
          from src.offline import OfflinePrometheus
          from src.brain.router import ModelRouter
          from src.tools.registry import registry
          from src.scanner.runner import ScanRunner
          from src.scanner.payload_engine import engine
          from src.knowledge.index import knowledge
          from src.agent.orchestrator import Orchestrator
          from src.cli.interface import CLI
          from src.scanner.adversarial import AdversarialValidator
          from src.scanner.api_discovery import APIDiscovery
          from src.agent.pipeline import PipelineOrchestrator
          print('All core imports OK')
          "
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --timeout=120 --ignore=tests/test_smart_tools.py --ignore=tests/test_scanner.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for security issues
        run: |
          pip install bandit
          bandit -r src/ -ll -ii --skip B101,B311,B603,B604,B605,B606,B607,B608
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify package builds
        run: |
          pip install build
          python -m build --sdist --no-isolation 2>&1 || echo "Build check completed"
